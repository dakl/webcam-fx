# The HandFX Mac app with its camera extension. make-app.sh (this Mac) and make-release.sh (a
# notarised DMG) generate the Xcode project from this file; HandFX.xcodeproj is not kept in git.
name: HandFX
options:
  bundleIdPrefix: se.dakl
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_HARDENED_RUNTIME: YES  # required for notarisation
    ARCHS: arm64  # the NuGet ONNX Runtime has no Intel build
packages:
  HandTracking:
    path: .
targets:
  HandFXApp:
    type: application
    platform: macOS
    sources:
      - Sources/HandFX
    dependencies:
      - package: HandTracking
        product: HandTracking
      - package: HandTracking
        product: PixelGrid
      - target: HandFXCamera
        embed: true
      - framework: Vendor/onnxruntime/lib/libonnxruntime.1.dylib  # from fetch-onnxruntime.sh
        embed: true
        codeSign: true
    entitlements:
      path: App/HandFX.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.security.device.camera: true  # the hardened runtime blocks the camera without it
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)se.dakl.handfx]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HandFX
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: HandFX tracks your hands in the camera picture to control the effects.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.dakl.handfx
        PRODUCT_NAME: HandFX
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_VERSION: "5.10"
  HandFXCamera:
    type: system-extension
    platform: macOS
    sources:
      - CameraExtension
    entitlements:
      path: CameraExtension/HandFXCamera.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)se.dakl.handfx]
    info:
      path: CameraExtension/Info.plist
      properties:
        CFBundleDisplayName: HandFX Camera
        CFBundlePackageType: SYSX  # marks the bundle as a system extension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: Adds the HandFX camera, which shows the HandFX app's picture with its effects in meeting apps.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.dakl.handfx.camera
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)  # macOS finds a system extension by this file name
        SWIFT_VERSION: "5.10"
