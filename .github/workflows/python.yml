name: python

on:
  push:
    branches: [main]
    paths: ["*.py", "tests/**", "pyproject.toml", "uv.lock", "Makefile", ".github/workflows/python.yml"]
  pull_request:
    paths: ["*.py", "tests/**", "pyproject.toml", "uv.lock", "Makefile", ".github/workflows/python.yml"]

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make lint-python
      # The scripts need a camera and macOS; the tests cover the gesture logic only.
      - if: ${{ !cancelled() }}
        run: make test-python
