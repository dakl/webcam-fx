name: app

on:
  push:
    branches: [main]
    paths: ["mac/**", "Makefile", ".github/workflows/app.yml"]
  pull_request:
    paths: ["mac/**", "Makefile", ".github/workflows/app.yml"]

# A private repo pays for macOS minutes at ten times the Linux rate, so this
# runs only when the app changed, and a new push stops the run before it.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    # macOS 27 with Xcode 27, which the app is built with. A preview image:
    # if it is slow to start or goes away, macos-26 is the one to try.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # ONNX Runtime's NuGet package is 184 MB; keep the extracted library between runs.
      - uses: actions/cache@v4
        with:
          path: mac/Vendor/onnxruntime
          key: onnxruntime-${{ hashFiles('mac/fetch-onnxruntime.sh') }}
      - run: make lint-app
      - if: ${{ !cancelled() }}
        run: make test-app
